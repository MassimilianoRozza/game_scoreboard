<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Card Game Tracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>[x-cloak] { display: none !important; }</style>
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-100 min-h-screen flex flex-col pb-0">
    {% include '_nav.html' %}
    <main class="flex-grow pb-12">
        {% block content %}{% endblock %}
    </main>
    <footer class="bg-gray-800 text-gray-400 text-xs py-3 px-4 mt-auto">
        <div class="max-w-4xl mx-auto flex justify-between items-center flex-wrap gap-2">
            <a href="{{ github_url }}"
               target="_blank"
               rel="noopener noreferrer"
               class="flex items-center gap-1 hover:text-white transition-colors">
                <!-- GitHub SVG icon -->
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.387.6.113.82-.258.82-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.108-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.31.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.52 11.52 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.652.242 2.873.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .322.218.694.825.576C20.565 21.796 24 17.298 24 12c0-6.63-5.37-12-12-12z"/>
                </svg>
                GitHub
            </a>
            <span class="font-mono text-gray-500">{{ app_version }}</span>
        </div>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
