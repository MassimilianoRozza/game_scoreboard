services:
  card-game-tracker:
    build: ./app
    container_name: card_game_server
    restart: always
    user: 1000:1000 # "${UID}:${GID}"
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=secret_key
      - ADMIN_PASSWORD="${ADMIN_PASSWORD:-yourPassword}"
    volumes:
      - ./data:/app/data
